<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>????? ????? ???</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #07111f;
            color: #fff;
            margin: 0;
            padding: 20px;
            text-align: center;
            direction: rtl;
        }

        h1 {
            font-size: 28px;
            margin-bottom: 10px;
            color: #00e676;
        }

        .status {
            font-size: 16px;
            margin: 15px 0;
            color: #aac8d7;
        }

        .radar-container {
            width: 100%;
            max-width: 500px;
            height: 400px;
            margin: 20px auto;
            position: relative;
            background-color: #0a1a2a;
            border-radius: 10px;
            overflow: hidden;
        }

        canvas {
            width: 100%;
            height: 100%;
        }

        button {
            background-color: #00e676;
            color: #00140f;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: #00b862;
        }

        button:disabled {
            background-color: #555;
            cursor: not-allowed;
        }

        .network-list {
            margin-top: 20px;
            text-align: right;
            max-width: 500px;
            margin-left: auto;
            margin-right: auto;
        }

        .network-item {
            background-color: #1a2a3a;
            padding: 10px;
            margin: 5px 0;
            border-radius: 5px;
            display: flex;
            justify-content: space-between;
            cursor: pointer;
        }

        .network-item:hover {
            background-color: #2a3a4a;
        }

        .network-name {
            font-weight: bold;
        }

        .network-signal {
            color: #ff5252;
        }

        .strong {
            color: #00e676;
        }

        .medium {
            color: #ffc107;
        }

        .weak {
            color: #ff5252;
        }

        .permission-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .permission-content {
            background-color: #1a2a3a;
            padding: 20px;
            border-radius: 10px;
            max-width: 400px;
            text-align: center;
        }

        .permission-content h2 {
            color: #ff5252;
        }

        .permission-content p {
            margin: 15px 0;
        }

        .close-btn {
            background-color: #555;
            color: #fff;
            padding: 8px 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>????? ????? ???</h1>
    <div class="status" id="status">???? ??? ???? ???? ?????</div>
    <div class="radar-container">
        <canvas id="radarCanvas"></canvas>
    </div>
    <button id="scanBtn">??? ???????</button>
    <div class="network-list" id="networkList"></div>

    <!-- ????? ??? ????? -->
    <div class="permission-modal" id="permissionModal" style="display: none;">
        <div class="permission-content">
            <h2>?? ??? ?????</h2>
            <p>??? ?????? ?????? ??????? ??? ??????? ??????? ?????? ?? ???????.</p>
            <p>??? ?? ???? ??? ?????? ???? ??:</p>
            <ul style="text-align: right; list-style: none; padding: 0;">
                <li>• ??????? ????? ???? (Chrome, Edge, Firefox)</li>
                <li>• ??? ?????? ??? <strong>HTTPS</strong> (???? HTTP)</li>
                <li>• ?????? ?????????? ??? ???? ???</li>
            </ul>
            <button class="close-btn" id="closePermission">?????</button>
        </div>
    </div>

    <script>
        // ??????? ???????
        const canvas = document.getElementById('radarCanvas');
        const ctx = canvas.getContext('2d');
        const scanBtn = document.getElementById('scanBtn');
        const statusText = document.getElementById('status');
        const networkList = document.getElementById('networkList');
        const permissionModal = document.getElementById('permissionModal');
        const closePermission = document.getElementById('closePermission');

        let networks = [];
        let sweepAngle = 0;
        let animationId;
        let isScanning = false;

        // ??? ??? Canvas
        function resizeCanvas() {
            const container = document.querySelector('.radar-container');
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
        }

        window.addEventListener('resize', () => {
            resizeCanvas();
            drawRadar();
        });

        // ??? ???????
        function drawRadar() {
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const radius = Math.min(centerX, centerY) * 0.8;

            // ??? Canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // ??? ??????? ???????
            ctx.strokeStyle = 'rgba(0, 120, 90, 0.6)';
            ctx.lineWidth = 1;
            for (let i = 1; i <= 4; i++) {
                ctx.beginPath();
                ctx.arc(centerX, centerY, radius * i / 4, 0, Math.PI * 2);
                ctx.stroke();
            }

            // ??? ?????? ??????? ????????
            ctx.beginPath();
            ctx.moveTo(centerX - radius, centerY);
            ctx.lineTo(centerX + radius, centerY);
            ctx.moveTo(centerX, centerY - radius);
            ctx.lineTo(centerX, centerY + radius);
            ctx.stroke();

            // ??? ?? ?????
            const sweepRadians = (sweepAngle * Math.PI) / 180;
            ctx.strokeStyle = 'rgba(0, 255, 170, 0.7)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(centerX, centerY);
            ctx.lineTo(
                centerX + Math.cos(sweepRadians) * radius,
                centerY + Math.sin(sweepRadians) * radius
            );
            ctx.stroke();

            // ??? ???? ??????
            ctx.fillStyle = '#00e676';
            ctx.beginPath();
            ctx.arc(centerX, centerY, 5, 0, Math.PI * 2);
            ctx.fill();

            // ??? ???????
            networks.forEach(network => {
                const angle = (network.hash % 360) * (Math.PI / 180);
                const strength = Math.min(1, Math.max(0, (network.signal + 100) / 60));
                const networkRadius = radius * (0.2 + (1 - strength) * 0.7);

                const x = centerX + Math.cos(angle) * networkRadius;
                const y = centerY + Math.sin(angle) * networkRadius;

                // ????? ??? ???????
                let signalColor;
                if (network.signal >= -60) signalColor = '#00e676'; // ???
                else if (network.signal >= -75) signalColor = '#ffc107'; // ?????
                else signalColor = '#ff5252'; // ????

                // ??? ???? ??????
                ctx.fillStyle = signalColor;
                ctx.globalAlpha = 0.7;
                ctx.beginPath();
                ctx.arc(x, y, 10, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1;

                // ??? ??? ??????
                ctx.fillStyle = '#fff';
                ctx.font = 'bold 12px Arial';
                ctx.textAlign = 'center';
                const shortName = network.ssid.length > 12 ? network.ssid.substring(0, 11) + '...' : network.ssid;
                ctx.fillText(`${shortName} (${network.signal}dBm)`, x, y - 15);
            });
        }

        // ????? ?? ?????
        function animateSweep() {
            sweepAngle = (sweepAngle + 2) % 360;
            drawRadar();
            animationId = requestAnimationFrame(animateSweep);
        }

        // ??? ?????
        async function scanNetworks() {
            if (isScanning) return;
            isScanning = true;
            scanBtn.disabled = true;
            statusText.textContent = "???? ??? ???????...";
            networkList.innerHTML = "";

            try {
                // ??? ????? ?????? ??? ???????
                const permission = await navigator.permissions.query({ name: 'wifi' });
                if (permission.state === 'denied') {
                    throw new Error("?? ??? ?????");
                }

                // ??? ??????? (??????: ?? ???? ?? ???? ?????????)
                if ('getNetworks' in navigator) {
                    const wifiNetworks = await navigator.getNetworks();
                    networks = wifiNetworks.map(network => ({
                        ssid: network.ssid || "???? ?????",
                        signal: network.signalStrength || -80, // ???? ????????
                        hash: hashCode(network.ssid || Math.random().toString())
                    }));
                } else {
                    // ?????? ?????? ??? ?? ??? API ??????
                    networks = [
                        { ssid: "Home_WiFi", signal: -50, hash: hashCode("Home_WiFi") },
                        { ssid: "Coffee_Shop", signal: -70, hash: hashCode("Coffee_Shop") },
                        { ssid: "Public_WiFi", signal: -85, hash: hashCode("Public_WiFi") },
                        { ssid: "AndroidAP", signal: -60, hash: hashCode("AndroidAP") }
                    ];
                    statusText.textContent = "?? ?? ???? ??????? ??? ??????? ???????. ??? ?????? ???????.";
                }

                // ??? ??????? ?? ???????
                updateNetworkList();

                // ??? ????? ???????
                if (!animationId) {
                    animateSweep();
                }

                statusText.textContent = `?? ?????? ??? ${networks.length} ????`;
            } catch (error) {
                console.error("??? ?? ?????:", error);
                statusText.textContent = "??? ?????: " + error.message;
                permissionModal.style.display = 'flex';
            } finally {
                isScanning = false;
                scanBtn.disabled = false;
            }
        }

        // ????? ????? ???????
        function updateNetworkList() {
            networkList.innerHTML = "";
            networks.forEach(network => {
                const signalClass = network.signal >= -60 ? 'strong' :
                                   network.signal >= -75 ? 'medium' : 'weak';

                const networkItem = document.createElement('div');
                networkItem.className = 'network-item';
                networkItem.innerHTML = `
                    <div class="network-name">${network.ssid}</div>
                    <div class="network-signal ${signalClass}">${network.signal}dBm</div>
                `;
                networkItem.addEventListener('click', () => {
                    alert(`??????: ${network.ssid}\n??? ???????: ${network.signal}dBm`);
                });
                networkList.appendChild(networkItem);
            });
        }

        // ???? ?????? ??? ?????? (??????? ?? ???????)
        function hashCode(str) {
            let hash = 0;
            for (let i = 0; i < str.length; i++) {
                hash = str.charCodeAt(i) + ((hash << 5) - hash);
            }
            return hash;
        }

        // ??? ????? ???????
        resizeCanvas();
        drawRadar();

        // ????? ???????
        scanBtn.addEventListener('click', scanNetworks);
        closePermission.addEventListener('click', () => {
            permissionModal.style.display = 'none';
        });
    </script>
</body>
</html>
